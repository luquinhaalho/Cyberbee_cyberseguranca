<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Gerenciador de Notas</title>
</head>
<body>
    <h1>Cadastro de Usuário</h1>
    <input type="text" id="newUser" placeholder="Novo Usuário">
    <input type="password" id="newPass" placeholder="Nova Senha">
    <button onclick="registrarUsuario()">Cadastrar</button>
    <div id="cadastroResultado" style="margin-top: 10px; min-height: 20px;"></div>

    <hr>

    <h1>Login do Sistema</h1>
    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
    <div id="loginResultado" style="margin-top: 10px; min-height: 20px;"></div>

    <script>
        // Função para cadastrar novo usuário (Mantida igual)
        async function registrarUsuario() {
            const usuario = document.getElementById('newUser').value;
            const senha = document.getElementById('newPass').value;
            const cadastroResultado = document.getElementById('cadastroResultado');
            cadastroResultado.innerHTML = "Cadastrando...";

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ usuario, senha })
                });
                const data = await response.json();
                if (response.ok) {
                    cadastroResultado.innerHTML = `<p style="color: green;">✅ ${data.message}</p>`;
                } else {
                    cadastroResultado.innerHTML = `<p style="color: red;">⚠️ ${data.message}</p>`;
                }
            } catch (error) {
                cadastroResultado.innerHTML = `<p style="color: red;">❌ Erro ao conectar.</p>`;
            }
        }

        //  login atualizada com LocalStorage e Redirecionamento
        async function fazerLogin() {
            const usuario = document.getElementById('user').value;
            const senha = document.getElementById('pass').value;
            const loginResultado = document.getElementById('loginResultado');
            loginResultado.innerHTML = "Autenticando...";

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    // token e o nome no "cofre" do navegador
                    localStorage.setItem('tokenUsuario', data.token);
                    localStorage.setItem('nomeUsuario', data.usuarioNoBanco);
                    
                    // redireciona o usuário para a área protegida
                    window.location.href = '/dashboard.html';
                } else {
                    loginResultado.innerHTML = `<p style="color: red;">⚠️ ${data.message}</p>`;
                }
            } catch (error) {
                loginResultado.innerHTML = `<p style="color: red;">❌ Erro ao conectar com o servidor.</p>`;
            }
        }
    </script>
</body>
</html>
