<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Notas - Dashboard Seguro</title>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 id="boasVindas">Área Restrita</h1>
        <button onclick="fazerLogout()" style="background-color: #ff4c4c; color: white;">Sair (Logout)</button>
    </div>
    <hr>

    <h2>1. Adicionar Nova Nota</h2>
    <input type="text" id="novoTitulo" placeholder="Título"><br><br>
    <textarea id="novoConteudo" placeholder="Conteúdo confidencial..." rows="4" cols="40"></textarea><br><br>
    <button onclick="salvarNota()">Salvar com Criptografia no Servidor</button>
    <div id="statusSalvar" style="margin-top: 10px; font-weight: bold;"></div>

    <hr>

    <h2>2. Consultar Nota por ID</h2>
    <input type="number" id="noteId" placeholder="ID da Nota">
    <button onclick="buscarNota()">Buscar Nota</button>
    
    <div id="resultado" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 50px;">
        Aguardando ação...
    </div>

    <script>
        const nome = localStorage.getItem('nomeUsuario');

        if (!nome) {
            alert("⚠️ Acesso restrito. Faça login primeiro.");
            window.location.href = '/';
        } else {
            document.getElementById('boasVindas').innerText = `Bem-vindo(a), ${nome}!`;
        }

        async function salvarNota() {
            const titulo = document.getElementById('novoTitulo').value;
            const conteudo = document.getElementById('novoConteudo').value;
            const status = document.getElementById('statusSalvar');

            try {
                const response = await fetch('/api/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo, conteudo })
                });
                const data = await response.json();
                if (response.ok) {
                    status.innerHTML = `<span style="color: green;">${data.message}</span>`;
                } else {
                    status.innerHTML = `<span style="color: red;">${data.message}</span>`;
                }
            } catch (error) {
                status.innerHTML = "❌ Erro ao salvar.";
            }
        }

        async function buscarNota() {
            const id = document.getElementById('noteId').value;
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = "Buscando...";

            try {
                const response = await fetch(`/api/notes/${id}`);
                const data = await response.json();
                
                if (response.status === 403 || response.status === 401) {
                    alert("⏰ Sessão expirada! Faça login novamente.");
                    fazerLogout(); return;
                }
                if (!response.ok) {
                    resultadoDiv.innerHTML = `<p style="color: red; font-weight: bold;">⚠️ ${data.message}</p>`;
                    return;
                }

                resultadoDiv.innerHTML = `
                    <div style="background-color: #e6f7ff; padding: 10px; border-radius: 5px;">
                        <h3>${data.titulo}</h3>
                        <p>${data.conteudo}</p>
                    </div>
                `;

            } catch (error) {
                resultadoDiv.innerHTML = "❌ Erro de conexão.";
            }
        }

        async function fazerLogout() {
            await fetch('/logout', { method: 'POST' });
            localStorage.removeItem('nomeUsuario');
            window.location.href = '/';
        }
    </script>
</body>
</html>
