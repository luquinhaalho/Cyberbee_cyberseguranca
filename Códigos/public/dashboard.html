<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Notas - Dashboard</title>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 id="boasVindas">Área Segura</h1>
        <button onclick="fazerLogout()" style="background-color: #ff4c4c; color: white;">Sair (Logout)</button>
    </div>
    
    <hr>

    <h2>Visualizar Nota (ID)</h2>
    <input type="number" id="noteId" placeholder="ID da Nota">
    <button onclick="buscarNota()">Buscar</button>
    
    <div id="resultado" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 50px;">
        Aguardando busca...
    </div>

    <script>
        // ==========================================
        // GUARDIÃO DA PÁGINA (Executado ao carregar)
        // ==========================================
        const nome = localStorage.getItem('nomeUsuario');

        // Se não tem o nome salvo, não deixa entrar (Guardião visual)
        if (!nome) {
            alert("⚠️ Acesso restrito. Faça login primeiro.");
            window.location.href = '/';
        } else {
            document.getElementById('boasVindas').innerText = `Bem-vindo(a), ${nome}!`;
        }

        async function buscarNota() {
            const id = document.getElementById('noteId').value;
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = "Buscando...";

            try {
                // A MÁGICA: Não precisamos passar o cabeçalho 'Authorization'.
                // O navegador anexa o Cookie HttpOnly sozinho em cada requisição!
                const response = await fetch(`/api/notes/${id}`, {
                    method: 'GET'
                });
                
                if (response.status === 403 || response.status === 401) {
                    alert("⏰ Sessão expirada ou inválida! Por favor, faça login novamente.");
                    fazerLogout(); 
                    return;
                }

                if (!response.ok) {
                    const erro = await response.json();
                    resultadoDiv.innerHTML = `<p style="color: red; font-weight: bold;">⚠️ ${erro.message}</p>`;
                    return;
                }

                const nota = await response.json();
                resultadoDiv.innerHTML = `
                    <div style="background-color: #e6f7ff; padding: 10px; border-radius: 5px;">
                        <h3 style="margin-top: 0;">${nota.titulo}</h3>
                        <p>${nota.conteudo}</p>
                    </div>
                `;
            } catch (error) {
                resultadoDiv.innerHTML = `<p style="color: red;">❌ Erro de conexão.</p>`;
            }
        }

        // Função de Logout atualizada (Pede ao servidor para destruir o cookie)
        async function fazerLogout() {
            await fetch('/logout', { method: 'POST' }); // Chamada silenciosa ao backend
            localStorage.removeItem('nomeUsuario'); // Limpa a estética do front
            window.location.href = '/';
        }
    </script>
</body>
</html>
